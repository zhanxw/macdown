name: Build DMG

on:
  push:
    branches: [master, main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dmg-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '4.0.6'
          bundler-cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: Tools/GitHub-style-generator/package-lock.json

      - name: Install dependencies
        run: |
          bundle exec pod install --deployment
          npm ci --prefix Tools/GitHub-style-generator
          make -C Dependency/peg-markdown-highlight

      - name: Test optimized ARM64 build
        run: |
          xcodebuild -workspace MacDown.xcworkspace -scheme MacDown \
            -configuration Release -destination 'platform=macOS,arch=arm64' \
            -derivedDataPath Build/Tests -resultBundlePath Build/TestResults.xcresult \
            ONLY_ACTIVE_ARCH=YES CODE_SIGN_IDENTITY=- \
            GCC_SYMBOLS_PRIVATE_EXTERN=NO ENABLE_TESTABILITY=YES test

      - name: Build universal app
        env:
          CI: 'false' # Preserve the Git-derived app version in packaged builds.
        run: |
          xcodebuild -workspace MacDown.xcworkspace -scheme MacDown \
            -configuration Release -derivedDataPath Build \
            ONLY_ACTIVE_ARCH=NO 'ARCHS=arm64 x86_64' \
            CODE_SIGN_IDENTITY=- CODE_SIGNING_REQUIRED=YES build
          app=Build/Build/Products/Release/MacDown.app
          for arch in arm64 x86_64; do
            lipo "$app/Contents/MacOS/MacDown" -verify_arch "$arch"
            lipo Build/Build/Products/Release/macdown -verify_arch "$arch"
            lipo "$app/Contents/Frameworks/Sparkle.framework/Sparkle" -verify_arch "$arch"
          done
          codesign --verify --deep --strict "$app"

      - name: Package DMG
        run: ./Tools/package-dmg.sh

      - name: Upload DMG
        uses: actions/upload-artifact@v4
        with:
          name: MacDown-universal-dmg
          path: |
            Build/DMG/MacDown-universal.dmg
            Build/DMG/MacDown-universal.dmg.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: MacDown-test-results
          path: Build/TestResults.xcresult
          if-no-files-found: ignore
          retention-days: 7
